name: Sync from the engine releases

# The engine this app runs is released in another repository, so no push here is
# the event that makes the bundle stale: `wickra-wasm` move when
# wickra publishes, and the caret range in package.json admits the new version
# without the lockfile following it. Pulling it on a schedule is the only trigger
# that can work -- the same shape the -site repositories run.
#
# The indicator count the app states (README, the page title and description,
# the picker's placeholder) follows the same release: the org's one rule set,
# wickra-lib/.github's scripts/sync-counts.mjs, checked out at a pinned commit,
# sets it to the core count of the latest wickra release.
on:
  schedule:
    - cron: "43 * * * *" # hourly at :43, clear of refresh-badges at :17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Pull the released engine versions and the indicator count
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits the refreshed lockfile and counts back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read wickra's released version
        id: wickra_wasm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/wickra-lib/wickra/releases/latest -q '.tag_name')
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::wickra's latest release tag '${tag}' is not a plain vX.Y.Z; refusing to write it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wickra's latest release is ${version}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Follow wickra-wasm into the lockfile
        env:
          V: ${{ steps.wickra_wasm.outputs.version }}
        # The point of the step is to move the lockfile; the version is the tag
        # that package's release job published, read from the API above.
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          if grep -q "\"wickra-wasm\": \"^${V}\"" package.json; then
            echo "already on wickra-wasm ^${V}"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund "wickra-wasm@^${V}"

      # One file, read-only, at a pinned commit. It lands beside the app and is
      # excluded from git, so the commit below cannot pick it up.
      - name: Check out the count rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wickra-lib/.github
          ref: d683af6320d14973d311968842600b332b7d3e79
          path: .wickra-org
          sparse-checkout: scripts/sync-counts.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set the indicator counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo ".wickra-org/" >> .git/info/exclude
          node .wickra-org/scripts/sync-counts.mjs --repo wickra-live

      - name: Commit if changed
        id: commitcheck
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "the released engines and the indicator count are current; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: wickra-lib/.github/actions/signed-commit@da1bd395c27f33dbed632c8e4e48e12f85394858 # v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: follow the released engine versions and the indicator count"
          paths: .
