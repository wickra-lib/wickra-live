name: Refresh status badges

# Snapshots the repo-status badge SVGs (CI, codecov, registry versions, …) into
# public/badges/ so the site serves them from its own origin instead of
# hot-linking the badge hosts at page load. Runs hourly and commits only when a
# badge actually changed; the commit triggers a Cloudflare Pages deploy. The
# site build never fetches these, so a badge-host outage can never break a
# deploy — see scripts/fetch-badges.mjs.
on:
  schedule:
    - cron: '17 * * * *' # hourly at :17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-badges
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Fetch badge snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-badges.mjs

      - name: Commit if changed
        id: commitcheck
        run: |
          if [ -z "$(git status --porcelain public/badges src/badges.json)" ]; then
            echo "badges unchanged; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: wickra-lib/.github/actions/signed-commit@782bf3d7a8edb80ada87dc7ba9067e2bf5752710 # v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: refresh status badge snapshots"
          paths: public/badges src/badges.json
