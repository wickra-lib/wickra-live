name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up Node (retry)
        if: steps.setup_node.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check & build
        run: npm run build

  # Advisory heads-up on link rot in the change itself; the weekly links.yml is
  # the full sweep. It can never turn a commit red: lychee runs with
  # continue-on-error on the step, so a dead link -- or one that resolves only
  # after the release, like the tag a CHANGELOG compare link names -- becomes a
  # warning annotation and a line in the job summary, which main_status lists.
  # A job-level continue-on-error would not do: the check run still concludes
  # `failure`, the commit shows red and a release gate reading check runs stops.
  links:
    name: External links (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        id: lychee
        continue-on-error: true
        timeout-minutes: 8
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" "*.md"
          fail: true
      - name: Report broken links as warnings
        if: steps.lychee.outcome == 'failure'
        run: |
          if [ -f lychee/out.md ]; then
            grep -E '^\* \[' lychee/out.md | head -n 30 \
              | sed -e 's/%/%25/g' -e 's/^\* /::warning title=Broken link::/' || true
          fi
          echo "::warning title=Broken links::lychee did not pass; the job summary lists every finding"
